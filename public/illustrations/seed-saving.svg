<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <!-- Seed saving on a dry October day: pods dried on the cane, envelopes and a jar on the bench. -->
  <defs>
    <linearGradient id="dry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c9a0"/>
      <stop offset="1" stop-color="#e8dcba"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#dry)"/>
  <circle cx="220" cy="120" r="50" fill="#f0dca8"/>
  <!-- hedge gone to seed -->
  <rect x="0" y="320" width="1200" height="58" fill="#8a7a48"/>
  <rect x="0" y="378" width="1200" height="297" fill="#b0a068"/>
  <!-- raised bed -->
  <g>
    <rect x="90" y="450" width="1020" height="14" fill="#8a5a3b"/>
    <rect x="90" y="464" width="1020" height="80" fill="#4a3628"/>
    <rect x="90" y="464" width="14" height="80" fill="#8a5a3b"/>
    <rect x="1096" y="464" width="14" height="80" fill="#8a5a3b"/>
  </g>
  <!-- bean canes with dried plants and rattling pods -->
  <g stroke="#a8825a" stroke-width="10" stroke-linecap="round">
    <line x1="300" y1="500" x2="310" y2="260"/>
    <line x1="620" y1="500" x2="630" y2="260"/>
    <line x1="940" y1="500" x2="950" y2="260"/>
  </g>
  <g>
    <g transform="translate(330 480)">
      <path d="M0 0 C -4 -80 4 -150 0 -210" stroke="#9a7a3a" stroke-width="8" fill="none"/>
      <g fill="#b09a55">
        <path d="M-2 -70 q-40 -10 -50 -40 q38 -4 52 24 z"/>
        <path d="M2 -130 q40 -10 50 -40 q-38 -4 -52 24 z"/>
        <path d="M-2 -180 q-36 -8 -46 -36 q34 -4 48 22 z"/>
      </g>
      <g fill="#a8825a">
        <ellipse cx="-34" cy="-100" rx="9" ry="22" transform="rotate(24 -34 -100)"/>
        <ellipse cx="30" cy="-96" rx="9" ry="22" transform="rotate(-20 30 -96)"/>
        <ellipse cx="-28" cy="-150" rx="9" ry="20" transform="rotate(28 -28 -150)"/>
        <ellipse cx="30" cy="-190" rx="9" ry="20" transform="rotate(-24 30 -190)"/>
      </g>
      <circle cx="-34" cy="-100" r="5" fill="#e9dcc0"/>
      <circle cx="30" cy="-96" r="5" fill="#e9dcc0"/>
    </g>
    <g transform="translate(650 480)">
      <path d="M0 0 C -4 -80 4 -150 0 -210" stroke="#9a7a3a" stroke-width="8" fill="none"/>
      <g fill="#b09a55">
        <path d="M-2 -90 q-40 -10 -50 -40 q38 -4 52 24 z"/>
        <path d="M2 -150 q40 -10 50 -40 q-38 -4 -52 24 z"/>
      </g>
      <g fill="#a8825a">
        <ellipse cx="-30" cy="-120" rx="9" ry="22" transform="rotate(22 -30 -120)"/>
        <ellipse cx="28" cy="-110" rx="9" ry="20" transform="rotate(-26 28 -110)"/>
        <ellipse cx="26" cy="-196" rx="9" ry="20" transform="rotate(-22 26 -196)"/>
      </g>
      <circle cx="-30" cy="-120" r="5" fill="#e9dcc0"/>
      <circle cx="28" cy="-110" r="5" fill="#e9dcc0"/>
    </g>
    <g transform="translate(970 480)">
      <path d="M0 0 C -4 -80 4 -150 0 -210" stroke="#9a7a3a" stroke-width="8" fill="none"/>
      <g fill="#b09a55">
        <path d="M-2 -60 q-40 -10 -50 -40 q38 -4 52 24 z"/>
        <path d="M2 -120 q40 -10 50 -40 q-38 -4 -52 24 z"/>
        <path d="M-2 -170 q-36 -8 -46 -36 q34 -4 48 22 z"/>
      </g>
      <g fill="#a8825a">
        <ellipse cx="-32" cy="-90" rx="9" ry="22" transform="rotate(24 -32 -90)"/>
        <ellipse cx="30" cy="-140" rx="9" ry="22" transform="rotate(-20 30 -140)"/>
        <ellipse cx="-26" cy="-196" rx="9" ry="20" transform="rotate(26 -26 -196)"/>
      </g>
      <circle cx="30" cy="-140" r="5" fill="#e9dcc0"/>
      <circle cx="-26" cy="-196" r="5" fill="#e9dcc0"/>
    </g>
  </g>
  <!-- the potting bench with envelopes and a jar -->
  <g>
    <rect x="60" y="560" width="440" height="18" fill="#8a5f30"/>
    <rect x="80" y="578" width="16" height="60" fill="#8a5f30"/>
    <rect x="460" y="578" width="16" height="60" fill="#8a5f30"/>
    <!-- two labelled envelopes -->
    <g transform="rotate(-6 180 520)">
      <rect x="130" y="500" width="100" height="64" rx="4" fill="#efe6cc"/>
      <path d="M130 500 l50 30 l50 -30" stroke="#c9ba96" stroke-width="3" fill="none"/>
      <rect x="146" y="540" width="56" height="8" rx="4" fill="#8a7a48"/>
    </g>
    <g transform="rotate(4 300 516)">
      <rect x="252" y="496" width="96" height="62" rx="4" fill="#efe6cc"/>
      <path d="M252 496 l48 28 l48 -28" stroke="#c9ba96" stroke-width="3" fill="none"/>
      <rect x="268" y="534" width="52" height="8" rx="4" fill="#8a7a48"/>
    </g>
    <!-- jar of seed -->
    <g transform="translate(420 520)">
      <rect x="-26" y="-16" width="52" height="58" rx="8" fill="#b9c4b0" opacity="0.85"/>
      <rect x="-26" y="14" width="52" height="28" rx="6" fill="#7a5a38"/>
      <ellipse cx="0" cy="-16" rx="26" ry="7" fill="#8a7a5a"/>
      <rect x="-30" y="-24" width="60" height="10" rx="4" fill="#6a5a3a"/>
    </g>
  </g>
  <!-- threshed beans scattered on the bed soil -->
  <g fill="#e9dcc0">
    <ellipse cx="700" cy="520" rx="7" ry="5"/>
    <ellipse cx="760" cy="532" rx="7" ry="5"/>
    <ellipse cx="820" cy="518" rx="7" ry="5"/>
    <ellipse cx="880" cy="530" rx="7" ry="5"/>
    <ellipse cx="940" cy="520" rx="7" ry="5"/>
  </g>
</svg>