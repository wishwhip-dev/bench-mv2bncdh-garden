<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <!-- Early spring: cutting drills and sowing the first rows. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9dcec"/>
      <stop offset="1" stop-color="#eef2e4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="1010" cy="120" r="58" fill="#f7f0d3"/>
  <circle cx="1010" cy="120" r="78" fill="#f7f0d3" opacity="0.25"/>
  <!-- distant hedge and fence -->
  <rect x="0" y="330" width="1200" height="40" fill="#9db98a"/>
  <rect x="0" y="368" width="1200" height="10" fill="#7a6a52"/>
  <rect x="120" y="300" width="10" height="70" fill="#7a6a52"/>
  <rect x="340" y="300" width="10" height="70" fill="#7a6a52"/>
  <rect x="560" y="300" width="10" height="70" fill="#7a6a52"/>
  <rect x="780" y="300" width="10" height="70" fill="#7a6a52"/>
  <rect x="1000" y="300" width="10" height="70" fill="#7a6a52"/>
  <!-- grass -->
  <rect x="0" y="378" width="1200" height="297" fill="#9db87a"/>
  <!-- three raised beds -->
  <g>
    <rect x="90" y="430" width="1020" height="14" fill="#8a5a3b"/>
    <rect x="90" y="444" width="1020" height="52" fill="#4a3628"/>
    <rect x="90" y="444" width="14" height="52" fill="#8a5a3b"/>
    <rect x="1096" y="444" width="14" height="52" fill="#8a5a3b"/>
  </g>
  <g>
    <rect x="90" y="540" width="1020" height="14" fill="#8a5a3b"/>
    <rect x="90" y="554" width="1020" height="60" fill="#4a3628"/>
    <rect x="90" y="554" width="14" height="60" fill="#8a5a3b"/>
    <rect x="1096" y="554" width="14" height="60" fill="#8a5a3b"/>
  </g>
  <!-- sown drills in the front bed: pale furrows with seed dots -->
  <g>
    <rect x="130" y="566" width="930" height="8" fill="#2e211a"/>
    <rect x="130" y="590" width="930" height="8" fill="#2e211a"/>
    <circle cx="180" cy="570" r="3" fill="#e8d8a8"/>
    <circle cx="300" cy="570" r="3" fill="#e8d8a8"/>
    <circle cx="430" cy="570" r="3" fill="#e8d8a8"/>
    <circle cx="560" cy="570" r="3" fill="#e8d8a8"/>
    <circle cx="690" cy="570" r="3" fill="#e8d8a8"/>
    <circle cx="820" cy="570" r="3" fill="#e8d8a8"/>
    <circle cx="950" cy="594" r="3" fill="#e8d8a8"/>
    <circle cx="820" cy="594" r="3" fill="#e8d8a8"/>
    <circle cx="690" cy="594" r="3" fill="#e8d8a8"/>
    <circle cx="560" cy="594" r="3" fill="#e8d8a8"/>
    <circle cx="430" cy="594" r="3" fill="#e8d8a8"/>
    <circle cx="240" cy="594" r="3" fill="#e8d8a8"/>
  </g>
  <!-- first seedling leaves breaking soil in the back bed -->
  <g fill="#7fae55">
    <path d="M260 444 q-8 -26 6 -40 q16 14 8 40 z"/>
    <path d="M292 444 q8 -26 -6 -40 q-16 14 -8 40 z"/>
    <path d="M560 444 q-8 -26 6 -40 q16 14 8 40 z"/>
    <path d="M592 444 q8 -26 -6 -40 q-16 14 -8 40 z"/>
    <path d="M860 444 q-8 -26 6 -40 q16 14 8 40 z"/>
  </g>
  <!-- rake leaning at the bed's end -->
  <g stroke="#7a6a52" stroke-width="8" stroke-linecap="round">
    <line x1="1120" y1="470" x2="1170" y2="300"/>
    <line x1="1128" y1="486" x2="1190" y2="470"/>
  </g>
  <g stroke="#7a6a52" stroke-width="5" stroke-linecap="round">
    <line x1="1140" y1="480" x2="1140" y2="500"/>
    <line x1="1156" y1="476" x2="1156" y2="496"/>
    <line x1="1172" y1="472" x2="1172" y2="492"/>
  </g>
  <!-- seed packet resting on the middle bed frame -->
  <g transform="rotate(-8 420 402)">
    <rect x="380" y="370" width="80" height="54" rx="4" fill="#e9dcc0"/>
    <rect x="380" y="370" width="80" height="14" rx="4" fill="#6b8f4e"/>
    <circle cx="420" cy="404" r="10" fill="#c98a3d"/>
  </g>
</svg>