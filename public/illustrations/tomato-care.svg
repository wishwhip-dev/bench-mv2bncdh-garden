<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <!-- High summer: staked tomatoes, twined canes, and pinched side-shoots on the path. -->
  <defs>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0ef"/>
      <stop offset="1" stop-color="#f2ead0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#hot)"/>
  <circle cx="190" cy="110" r="60" fill="#f7d774"/>
  <circle cx="190" cy="110" r="84" fill="#f7d774" opacity="0.3"/>
  <!-- hedge -->
  <rect x="0" y="320" width="1200" height="58" fill="#5f8a4a"/>
  <rect x="0" y="378" width="1200" height="297" fill="#94b072"/>
  <!-- raised bed -->
  <g>
    <rect x="90" y="450" width="1020" height="14" fill="#8a5a3b"/>
    <rect x="90" y="464" width="1020" height="80" fill="#4a3628"/>
    <rect x="90" y="464" width="14" height="80" fill="#8a5a3b"/>
    <rect x="1096" y="464" width="14" height="80" fill="#8a5a3b"/>
  </g>
  <!-- bamboo canes -->
  <g stroke="#c8a86a" stroke-width="10" stroke-linecap="round">
    <line x1="230" y1="500" x2="242" y2="240"/>
    <line x1="530" y1="500" x2="542" y2="240"/>
    <line x1="830" y1="500" x2="842" y2="240"/>
  </g>
  <!-- three staked tomato plants -->
  <g>
    <g transform="translate(262 480)">
      <path d="M0 0 C -6 -90 4 -170 0 -230" stroke="#4d7a35" stroke-width="9" fill="none"/>
      <g fill="#5f9440">
        <path d="M-2 -60 q-44 -8 -56 -38 q40 -6 58 22 z"/>
        <path d="M2 -60 q44 -8 56 -38 q-40 -6 -58 22 z"/>
        <path d="M-2 -120 q-44 -8 -56 -38 q40 -6 58 22 z"/>
        <path d="M2 -120 q44 -8 56 -38 q-40 -6 -58 22 z"/>
        <path d="M-2 -180 q-40 -8 -50 -36 q36 -6 52 20 z"/>
        <path d="M2 -180 q40 -8 50 -36 q-36 -6 -52 20 z"/>
      </g>
      <g fill="#d64b35">
        <circle cx="-30" cy="-92" r="13"/>
        <circle cx="-46" cy="-72" r="11"/>
        <circle cx="28" cy="-140" r="13"/>
        <circle cx="44" cy="-122" r="11"/>
        <circle cx="-26" cy="-196" r="12"/>
      </g>
      <g fill="#e8854f" opacity="0.6">
        <circle cx="-33" cy="-95" r="4"/>
        <circle cx="31" cy="-143" r="4"/>
      </g>
    </g>
    <g transform="translate(562 480)">
      <path d="M0 0 C -6 -90 4 -170 0 -230" stroke="#4d7a35" stroke-width="9" fill="none"/>
      <g fill="#5f9440">
        <path d="M-2 -80 q-44 -8 -56 -38 q40 -6 58 22 z"/>
        <path d="M2 -80 q44 -8 56 -38 q-40 -6 -58 22 z"/>
        <path d="M-2 -140 q-44 -8 -56 -38 q40 -6 58 22 z"/>
        <path d="M2 -140 q44 -8 56 -38 q-40 -6 -58 22 z"/>
      </g>
      <g fill="#d64b35">
        <circle cx="-28" cy="-108" r="13"/>
        <circle cx="30" cy="-160" r="12"/>
        <circle cx="46" cy="-142" r="10"/>
      </g>
    </g>
    <g transform="translate(862 480)">
      <path d="M0 0 C -6 -90 4 -170 0 -230" stroke="#4d7a35" stroke-width="9" fill="none"/>
      <g fill="#5f9440">
        <path d="M-2 -50 q-44 -8 -56 -38 q40 -6 58 22 z"/>
        <path d="M2 -50 q44 -8 56 -38 q-40 -6 -58 22 z"/>
        <path d="M-2 -110 q-44 -8 -56 -38 q40 -6 58 22 z"/>
        <path d="M2 -110 q44 -8 56 -38 q-40 -6 -58 22 z"/>
        <path d="M-2 -170 q-40 -8 -50 -36 q36 -6 52 20 z"/>
      </g>
      <g fill="#d64b35">
        <circle cx="28" cy="-78" r="13"/>
        <circle cx="-30" cy="-130" r="12"/>
        <circle cx="26" cy="-188" r="12"/>
      </g>
    </g>
  </g>
  <!-- figure-of-eight twine tying stems to canes -->
  <g fill="none" stroke="#e9dcc0" stroke-width="4">
    <ellipse cx="240" cy="330" rx="14" ry="8"/>
    <ellipse cx="540" cy="350" rx="14" ry="8"/>
    <ellipse cx="840" cy="320" rx="14" ry="8"/>
  </g>
  <!-- pinched side-shoots on the path -->
  <g transform="translate(390 560)">
    <path d="M0 0 q-20 -26 -44 -30" stroke="#4d7a35" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-30 -26 q-16 -12 -30 -10 q4 16 22 18 z" fill="#5f9440"/>
  </g>
  <g transform="translate(700 575)">
    <path d="M0 0 q-18 -24 -40 -28" stroke="#4d7a35" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-26 -24 q-14 -12 -28 -10 q4 14 20 16 z" fill="#5f9440"/>
  </g>
  <!-- watering can waiting at the bed's end -->
  <g transform="translate(1150 520)">
    <rect x="-26" y="-10" width="44" height="42" rx="8" fill="#5b7d8a"/>
    <path d="M18 2 q26 6 30 26 l-10 4 q-6 -16 -22 -20 z" fill="#5b7d8a"/>
    <path d="M-26 0 q-20 -26 -8 -44 l10 4 q-8 16 8 32 z" fill="#5b7d8a"/>
  </g>
</svg>