<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <!-- August heat spell: a bleached sky, a heavy watering can, and drooping then revived rows. -->
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c98a"/>
      <stop offset="1" stop-color="#e8d5a8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#heat)"/>
  <circle cx="600" cy="130" r="70" fill="#f0a83c"/>
  <circle cx="600" cy="130" r="100" fill="#f0a83c" opacity="0.25"/>
  <circle cx="600" cy="130" r="130" fill="#f0a83c" opacity="0.12"/>
  <!-- heat shimmer lines -->
  <g stroke="#e8b26a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M180 250 q20 -12 40 0"/>
    <path d="M1020 240 q20 -12 40 0"/>
    <path d="M140 300 q16 -10 32 0"/>
  </g>
  <!-- parched ground -->
  <rect x="0" y="340" width="1200" height="44" fill="#a89560"/>
  <rect x="0" y="378" width="1200" height="297" fill="#c2a878"/>
  <g stroke="#a8905e" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="410" x2="180" y2="410"/>
    <line x1="300" y1="430" x2="380" y2="430"/>
    <line x1="760" y1="400" x2="850" y2="400"/>
    <line x1="1000" y1="440" x2="1080" y2="440"/>
  </g>
  <!-- raised bed -->
  <g>
    <rect x="90" y="460" width="1020" height="14" fill="#8a5a3b"/>
    <rect x="90" y="474" width="1020" height="80" fill="#4a3628"/>
    <rect x="90" y="474" width="14" height="80" fill="#8a5a3b"/>
    <rect x="1096" y="474" width="14" height="80" fill="#8a5a3b"/>
  </g>
  <!-- left rows: wilted beans drooping in the heat -->
  <g transform="translate(230 474)">
    <g stroke="#7a8a4a" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M0 0 C 4 -40 -4 -70 -14 -88"/>
      <path d="M40 0 C 44 -40 36 -70 28 -90"/>
      <path d="M80 0 C 84 -40 76 -68 70 -86"/>
    </g>
    <g fill="#93a05a">
      <path d="M-14 -88 q-22 2 -30 -16 q22 -8 32 6 z"/>
      <path d="M28 -90 q-20 6 -30 -10 q20 -10 32 2 z"/>
      <path d="M70 -86 q-20 4 -28 -12 q20 -8 30 4 z"/>
    </g>
  </g>
  <!-- right rows: watered and standing up again -->
  <g transform="translate(700 474)">
    <g stroke="#4d7a35" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M0 0 C -2 -50 2 -90 0 -120"/>
      <path d="M40 0 C 38 -50 42 -90 40 -120"/>
      <path d="M80 0 C 78 -50 82 -90 80 -118"/>
    </g>
    <g fill="#5f9440">
      <path d="M0 -120 q-34 -6 -44 -32 q36 -8 48 20 z"/>
      <path d="M40 -120 q34 -6 44 -32 q-36 -8 -48 20 z"/>
      <path d="M80 -118 q-34 -6 -44 -32 q36 -8 48 20 z"/>
    </g>
  </g>
  <!-- the big can, mid-pour over the revived rows -->
  <g transform="translate(560 400)">
    <rect x="-40" y="-20" width="80" height="72" rx="12" fill="#5b7d8a"/>
    <path d="M40 -6 q40 8 44 40 l-14 6 q-8 -24 -30 -30 z" fill="#5b7d8a"/>
    <path d="M-40 -10 q-26 -36 -10 -60 l12 6 q-12 22 10 44 z" fill="#5b7d8a"/>
    <ellipse cx="-44" cy="-64" rx="14" ry="8" fill="#4a6a76"/>
    <circle cx="-50" cy="-52" r="4" fill="#8fc4d4"/>
    <circle cx="-58" cy="-36" r="4" fill="#8fc4d4"/>
    <circle cx="-50" cy="-20" r="4" fill="#8fc4d4"/>
    <circle cx="-58" cy="-4" r="4" fill="#8fc4d4"/>
  </g>
  <!-- dark, actually-wet soil where the water has landed -->
  <path d="M560 474 q60 26 180 0 l0 80 l-180 0 z" fill="#33241b"/>
</svg>