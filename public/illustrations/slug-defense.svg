<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img">
  <!-- Late spring dusk: lettuces, a slug on the move, and a sunk beer trap between them. -->
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b27a"/>
      <stop offset="0.6" stop-color="#c98a8f"/>
      <stop offset="1" stop-color="#7e5a78"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#dusk)"/>
  <circle cx="180" cy="130" r="46" fill="#f6ecd8"/>
  <!-- birds heading home -->
  <g stroke="#4a3a52" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M560 110 q14 -14 28 0"/>
    <path d="M620 90 q14 -14 28 0"/>
    <path d="M680 130 q12 -12 24 0"/>
  </g>
  <!-- hedge and grass in dusk light -->
  <rect x="0" y="330" width="1200" height="48" fill="#5e7050"/>
  <rect x="0" y="378" width="1200" height="297" fill="#5d7a55"/>
  <!-- raised bed -->
  <g>
    <rect x="90" y="470" width="1020" height="14" fill="#6e4a32"/>
    <rect x="90" y="484" width="1020" height="70" fill="#3d2d22"/>
    <rect x="90" y="484" width="14" height="70" fill="#6e4a32"/>
    <rect x="1096" y="484" width="14" height="70" fill="#6e4a32"/>
  </g>
  <!-- lettuces, one with a hole nibbled in it -->
  <g>
    <g transform="translate(230 484)">
      <circle cx="0" cy="-34" r="36" fill="#8fbf6a"/>
      <path d="M-24 -52 q24 -16 48 0 q-6 14 -24 14 q-18 0 -24 -14 z" fill="#b8d98e"/>
      <path d="M-14 -18 q14 8 28 0 l-4 12 q-10 6 -20 0 z" fill="#6ba050"/>
    </g>
    <g transform="translate(460 484)">
      <circle cx="0" cy="-34" r="36" fill="#8fbf6a"/>
      <path d="M-24 -52 q24 -16 48 0 q-6 14 -24 14 q-18 0 -24 -14 z" fill="#b8d98e"/>
      <circle cx="10" cy="-40" r="7" fill="#3d2d22"/>
    </g>
    <g transform="translate(700 484)">
      <circle cx="0" cy="-34" r="36" fill="#8fbf6a"/>
      <path d="M-24 -52 q24 -16 48 0 q-6 14 -24 14 q-18 0 -24 -14 z" fill="#b8d98e"/>
    </g>
    <g transform="translate(930 484)">
      <circle cx="0" cy="-34" r="36" fill="#8fbf6a"/>
      <path d="M-24 -52 q24 -16 48 0 q-6 14 -24 14 q-18 0 -24 -14 z" fill="#b8d98e"/>
      <path d="M-16 -24 q12 8 24 0 l-2 10 q-10 4 -20 0 z" fill="#6ba050"/>
    </g>
  </g>
  <!-- the slug, mid-crossing between lettuce and trap -->
  <g transform="translate(560 470)">
    <path d="M-34 0 q0 -26 30 -26 q28 0 34 14 q22 -4 30 12 l-94 0 z" fill="#a8865f"/>
    <path d="M-34 0 l94 0 q-6 6 -20 6 l-58 0 q-12 0 -16 -6 z" fill="#8a6a48"/>
    <line x1="24" y1="-26" x2="20" y2="-40" stroke="#8a6a48" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="-24" x2="34" y2="-38" stroke="#8a6a48" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="-41" r="3" fill="#3d2d22"/>
    <circle cx="34" cy="-39" r="3" fill="#3d2d22"/>
    <path d="M-30 6 q30 6 60 0 q30 -4 58 2" stroke="#7d6a55" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- sunk beer trap: a jar set into the soil -->
  <g transform="translate(815 500)">
    <ellipse cx="0" cy="34" rx="30" ry="8" fill="#2a1f18"/>
    <rect x="-26" y="-26" width="52" height="60" rx="8" fill="#b9a98a" opacity="0.9"/>
    <rect x="-26" y="6" width="52" height="28" rx="6" fill="#8a5a2b"/>
    <ellipse cx="0" cy="-26" rx="26" ry="7" fill="#f0e3c0"/>
  </g>
  <!-- copper tape glinting on the bed frame -->
  <rect x="90" y="470" width="1020" height="6" fill="#c98a3d"/>
</svg>